<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다</title>
  <style>
    :root { --bg:#DDE2E5; --ink:#1B2630; --muted:#55626C; --bad:#CF4436; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141A1F; --ink:#E3E8EB; --muted:#98A5AE; color-scheme: dark; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; padding:1.25rem; }
    .box { max-width:32rem; }
    .lamp { width:1.4rem; height:1.4rem; border-radius:50%; background:var(--bad); margin-bottom:1rem;
            box-shadow: inset 0 -3px 4px rgba(0,0,0,.25), 0 0 12px 2px rgba(207,68,54,.45); }
    h1 { font-size:2rem; line-height:1.2; margin:0 0 .5rem; }
    p { color:var(--muted); margin:0 0 1.25rem; }
    a { display:inline-block; font-weight:700; padding:.7rem 1.2rem; background:var(--ink); color:var(--bg); border-radius:6px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lamp" aria-hidden="true"></div>
    <h1>이 주소에는 페이지가 없습니다</h1>
    <p>주소의 철자와 대소문자를 확인하세요. 이 화면이 보인다는 건 404.html도 제대로 올라갔다는 뜻입니다.</p>
    <a id="home" href="/">사이트 첫 페이지로</a>
  </div>
  <script>
    // GitHub Pages 저장소 주소(사용자이름.github.io/저장소이름/)일 때 첫 페이지 링크를 맞춰 줍니다.
    if (/\.github\.io$/.test(location.hostname)) {
      var first = location.pathname.split('/')[1];
      if (first) document.getElementById('home').href = '/' + first + '/';
    }
  </script>
</body>
</html>
